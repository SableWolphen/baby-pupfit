<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1224">
<title>Baby PupFit</title>
<style>
:root{--bg:#0b1224;--panel:#17223a;--panel2:#0f192c;--line:#2b3b5e;--txt:#f8f9ff;--muted:#aeb9d4;--blue:#8bd5ff;--lav:#c9b7ff;--green:#9af0b5;--red:#ffb2bd;--gold:#ffd98b}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#0b1224,#15132b);color:var(--txt);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;min-height:100vh}.wrap{max-width:760px;margin:auto;padding:10px 10px 92px}.hero{display:flex;align-items:end;justify-content:space-between;padding:6px 2px}.hero h1{margin:0;font-size:1.55rem}.muted{color:var(--muted)}.small{font-size:.8rem}.card{background:rgba(23,34,58,.97);border:1px solid var(--line);border-radius:18px;padding:12px;margin:8px 0}.soft{background:linear-gradient(145deg,rgba(139,213,255,.12),rgba(201,183,255,.11))}.title{font-size:1.12rem;font-weight:950}.label{font-size:.68rem;font-weight:950;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}.big{font-size:1.35rem;font-weight:1000}.btn{border:0;border-radius:12px;min-height:42px;padding:8px 12px;font-weight:950;cursor:pointer}.primary{background:linear-gradient(90deg,var(--blue),var(--lav));color:#07111e}.secondary{background:#22304d;color:#fff;border:1px solid var(--line)}.good{background:rgba(154,240,181,.13);color:var(--green);border:1px solid rgba(154,240,181,.35)}.bad{background:rgba(255,178,189,.12);color:var(--red);border:1px solid rgba(255,178,189,.3)}.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}.section{display:none}.section.active{display:block}.bottomnav{position:fixed;z-index:30;left:50%;bottom:7px;transform:translateX(-50%);width:min(96vw,730px);display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:6px;background:rgba(10,17,32,.98);border:1px solid var(--line);border-radius:18px}.navbtn{border:0;background:transparent;color:var(--muted);border-radius:11px;padding:8px 2px;font-size:.7rem;font-weight:900}.navbtn.active{background:rgba(139,213,255,.15);color:#fff}.progress{height:8px;background:#08101f;border:1px solid var(--line);border-radius:999px;overflow:hidden}.progress>div{height:100%;background:linear-gradient(90deg,var(--blue),var(--lav))}.priority{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.pbox{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center;font-size:.72rem}.sessionState{display:flex;align-items:center;justify-content:space-between;gap:8px}.doneBadge{display:inline-block;padding:5px 8px;border-radius:999px;background:rgba(154,240,181,.12);border:1px solid rgba(154,240,181,.35);color:var(--green);font-size:.74rem;font-weight:950}.pager{display:grid;grid-template-columns:auto 1fr auto;gap:7px;align-items:center}.pagerTitle{text-align:center}.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:3px 7px;font-size:.7rem;color:var(--muted);margin:3px 2px 0}.rec{margin-top:8px;padding:8px;border-radius:11px;background:rgba(139,213,255,.08);border:1px solid rgba(139,213,255,.22);font-size:.84rem}.sethead,.setrow{display:grid;grid-template-columns:38px 1fr 1fr 36px;gap:5px;align-items:center}.sethead{padding:0 4px;margin-top:10px;font-size:.62rem;color:var(--muted);text-transform:uppercase;font-weight:950}.setrow{background:#0a1528;border:1px solid var(--line);border-radius:10px;padding:4px;margin-top:4px}.setrow.done{border-color:rgba(154,240,181,.55);background:rgba(154,240,181,.06)}.setnum{text-align:center;font-size:.78rem;font-weight:950}.setrow input{width:100%;min-height:34px;border-radius:9px;border:1px solid var(--line);background:#081224;color:#fff;text-align:center;font:inherit;font-weight:900;padding:4px}.checkbtn{width:34px;height:34px;min-height:34px;padding:0;border-radius:50%;font-size:1rem}.effort{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:8px}.effort .btn{min-height:34px;padding:4px;font-size:.68rem}.effort .selected{outline:2px solid var(--blue)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:9px}.historyCard{cursor:pointer}.histTop{display:flex;align-items:center;justify-content:space-between;gap:8px}.exerciseMini{padding:6px 0;border-top:1px solid var(--line);font-size:.82rem}.planDay{border-left:4px solid var(--blue)}.planEx{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:.84rem}@media(max-width:560px){.priority{grid-template-columns:1fr 1fr}.effort{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="wrap">
<header class="hero"><div><h1>🐾 Baby PupFit</h1><div id="dateLine" class="muted small"></div></div><div class="label">Workout only</div></header>

<section id="today" class="section active">
  <div class="card soft"><div class="label">Body goal priority</div><div class="priority" style="margin-top:7px"><div class="pbox">✨<br><b>Abs</b></div><div class="pbox">🍑<br><b>Glutes</b></div><div class="pbox">💪<br><b>Upper</b></div><div class="pbox">🦵<br><b>Thighs</b></div></div></div>
  <div class="card" id="todayCard"></div>
  <div class="card"><div class="title">This week</div><div id="weekSummary" class="muted small" style="margin-top:6px"></div></div>
</section>

<section id="workout" class="section">
  <div class="card soft"><div class="sessionState"><div><div class="label">Current workout</div><div class="title" id="workoutTitle"></div><div class="muted small" id="workoutSub"></div></div><div class="big" id="workoutCount"></div></div><div class="progress" style="margin-top:8px"><div id="workoutBar"></div></div></div>
  <div class="card" id="exerciseCard"></div>
  <div class="card"><button id="finishBtn" class="btn primary" style="width:100%">✅ Finish workout</button></div>
</section>

<section id="history" class="section">
  <div class="card soft"><div class="title">📚 Workout history</div><div class="muted small">Completed workouts stay here with every weight and rep you logged.</div></div>
  <div id="historyList"></div>
</section>

<section id="plan" class="section">
  <div class="card soft"><div class="title">🗓️ Weekly plan</div><div class="muted small">Machine-focused. No Captain's Chair. No hip thrusts.</div></div>
  <div id="planList"></div>
</section>
</div>

<nav class="bottomnav"><button class="navbtn active" data-tab="today">🏠<br>Today</button><button class="navbtn" data-tab="workout">🏋️<br>Workout</button><button class="navbtn" data-tab="history">📚<br>History</button><button class="navbtn" data-tab="plan">🗓️<br>Plan</button></nav>

<script>
const $=id=>document.getElementById(id),now=new Date(),TODAY=localISO(now);dateLine.textContent=now.toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'});
function localISO(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}}
function set(k,v){localStorage.setItem(k,JSON.stringify(v))}
const starts={'Ab Crunch Machine':30,'Rotary Torso Machine':20,'Glute Kickback Machine':20,'Hip Abduction':40,'Leg Press':90,'Lat Pulldown':40,'Seated Row':40,'Lateral Raise Machine':20,'Machine Chest Press':30,'Cable / Machine Biceps Curl':20,'Rope Triceps Pressdown':25,'Seated Leg Curl':40,'Reverse Pec Deck':25,'Leg Extension':35};
const plans={
1:{name:'✨ Abs + 🍑 Glutes A',note:'Abs first, then glutes.',ex:[['Ab Crunch Machine',4,8,15,'abs','small'],['Rotary Torso Machine',2,10,15,'abs','small'],['Glute Kickback Machine',4,10,15,'glute','small'],['Hip Abduction',3,15,25,'glute','small'],['Leg Press',3,8,12,'glute','big']]},
2:{name:'💪 Upper + Arms A',note:'Back, shoulders, chest and arms.',ex:[['Lat Pulldown',3,8,12,'upper','big'],['Seated Row',3,8,12,'upper','big'],['Lateral Raise Machine',3,12,20,'upper','small'],['Machine Chest Press',2,8,12,'upper','big'],['Cable / Machine Biceps Curl',3,10,15,'arms','small'],['Rope Triceps Pressdown',3,10,15,'arms','small']]},
4:{name:'✨ Abs + 🍑 Glutes B',note:'Second hard ab/glute day.',ex:[['Ab Crunch Machine',4,10,15,'abs','small'],['Rotary Torso Machine',2,12,15,'abs','small'],['Glute Kickback Machine',4,10,15,'glute','small'],['Hip Abduction',3,15,25,'glute','small'],['Leg Press',3,10,15,'glute','big'],['Seated Leg Curl',2,10,15,'thigh','big']]},
5:{name:'💪 Upper + Arms B + ✨ Abs',note:'Upper-body shape plus abs.',ex:[['Lat Pulldown',3,10,12,'upper','big'],['Lateral Raise Machine',3,12,20,'upper','small'],['Reverse Pec Deck',2,12,20,'upper','small'],['Cable / Machine Biceps Curl',3,10,15,'arms','small'],['Rope Triceps Pressdown',3,10,15,'arms','small'],['Ab Crunch Machine',2,12,15,'abs','small']]},
6:{name:'✨ Abs + 🍑 Glute Shape + 🦵 Thighs',note:'Shape/pump day.',ex:[['Ab Crunch Machine',3,12,15,'abs','small'],['Rotary Torso Machine',2,12,15,'abs','small'],['Glute Kickback Machine',3,12,20,'glute','small'],['Hip Abduction',3,18,30,'glute','small'],['Leg Extension',2,12,15,'thigh','small'],['Seated Leg Curl',2,12,15,'thigh','big']]}}
const STORE='pupfit_workout_sessions_v2';let sessions=get(STORE,{}),workoutIndex=0;
function sessionId(date,dow){return `${date}|${dow}`}
function todayPlan(){return plans[now.getDay()]||null}
function makeExercise(ex){let[name,sets,min,max,cat,size]=ex,prev=latestCompletedExercise(name),w=prev?workingWeight(prev):(starts[name]||0);return {name,setsTarget:sets,min,max,category:cat,size,effort:2,setData:Array.from({length:sets},()=>({weight:w,reps:'',done:false}))}}
function ensureTodaySession(){let p=todayPlan();if(!p)return null;let id=sessionId(TODAY,now.getDay());if(!sessions[id]){sessions[id]={id,date:TODAY,dow:now.getDay(),name:p.name,note:p.note,status:'in_progress',createdAt:Date.now(),updatedAt:Date.now(),exercises:p.ex.map(makeExercise)};saveSessions()}return sessions[id]}
function saveSessions(){set(STORE,sessions)}
function allSessions(){return Object.values(sessions).sort((a,b)=>b.date.localeCompare(a.date)||((b.updatedAt||0)-(a.updatedAt||0)))}
function latestCompletedExercise(name){for(const s of allSessions()){if(s.status!=='complete')continue;let e=s.exercises?.find(x=>x.name===name);if(e)return e}return null}
function workingWeight(e){let good=(e.setData||[]).filter(s=>s.done&&+s.weight>=0&&+s.reps>0);return good.length?+good[0].weight:0}
function bestRep(e){return Math.max(0,...(e.setData||[]).map(s=>+s.reps||0))}
function recommendation(e){let prev=latestCompletedExercise(e.name);if(!prev)return `First try: ${starts[e.name]||'lightest setting'} lb. Adjust after Set 1.`;let w=workingWeight(prev),best=bestRep(prev),eff=+prev.effort;if(best>=e.max&&eff<=2)return `Next time: add a small amount of weight${w?` from ${w} lb`:''}.`;if(best<e.min)return 'Next time: use a little less weight.';if(eff>=3)return 'Next time: go a little heavier.';return `Keep the same weight and try to beat ${best} reps.`}
function migrateLegacy(){if(get('pupfit_v2_migrated',false))return;let old=get('pupfit_smart_logs',[]),completed=get('pupfit_completed_workouts',{});let byDate={};old.forEach(l=>{if(!l?.date)return;(byDate[l.date]??=[]).push(l)});for(const [date,rows] of Object.entries(byDate)){let d=new Date(date+'T12:00:00'),dow=d.getDay(),p=plans[dow];if(!p)continue;let id=sessionId(date,dow);if(sessions[id])continue;let exs=[];for(const def of p.ex){let [name,sets,min,max,cat,size]=def,hit=rows.filter(r=>r.exercise===name).sort((a,b)=>(b.time||0)-(a.time||0))[0];if(hit){let data=hit.setData?.length?hit.setData.map(s=>({weight:+s.weight||0,reps:+s.reps||0,done:true})):Array.from({length:hit.sets||sets},()=>({weight:+hit.weight||0,reps:+hit.reps||0,done:true}));exs.push({name,setsTarget:sets,min,max,category:cat,size,effort:+hit.rir||2,setData:data})}else exs.push(makeExercise(def))}sessions[id]={id,date,dow,name:p.name,note:p.note,status:(completed[date]||rows.some(r=>r.finished))?'complete':'in_progress',createdAt:Math.min(...rows.map(r=>r.time||Date.now())),updatedAt:Math.max(...rows.map(r=>r.time||Date.now())),exercises:exs,legacy:true}}
saveSessions();set('pupfit_v2_migrated',true)}
function renderToday(){let p=todayPlan(),id=p?sessionId(TODAY,now.getDay()):null,s=id?sessions[id]:null;if(!p){todayCard.innerHTML=`<div class="label">Today</div><div class="title">😴 Recovery day</div><div class="muted small" style="margin-top:5px">No workout scheduled today. Use the Plan tab to see the next lifting day.</div>`}else if(s?.status==='complete'){todayCard.innerHTML=`<div class="sessionState"><div><div class="label">Today</div><div class="title">${p.name}</div><div class="muted small">Workout saved with all logged sets.</div></div><span class="doneBadge">✓ Completed</span></div><button class="btn secondary" style="width:100%;margin-top:9px" onclick="openWorkout()">Review workout</button>`}else{let started=!!s;todayCard.innerHTML=`<div class="label">Today</div><div class="title">${p.name}</div><div class="muted small" style="margin-top:4px">${p.note}</div><button class="btn primary" style="width:100%;margin-top:9px" onclick="openWorkout()">${started?'Continue workout':'Start workout'} →</button>`}
let start=new Date(now);start.setDate(now.getDate()-((now.getDay()+6)%7));let lines=[];for(let i=0;i<7;i++){let d=new Date(start);d.setDate(start.getDate()+i);let dow=d.getDay(),date=localISO(d),p2=plans[dow];if(!p2)continue;let s2=sessions[sessionId(date,dow)],mark=s2?.status==='complete'?'✅':s2?'🟡':'○';lines.push(`${mark} ${d.toLocaleDateString(undefined,{weekday:'short'})}: ${p2.name}`)}weekSummary.innerHTML=lines.join('<br>')}
function openWorkout(){let s=ensureTodaySession();if(!s){alert('No workout scheduled today.');return}workoutIndex=Math.min(workoutIndex,s.exercises.length-1);showTab('workout')}
function currentSession(){let p=todayPlan();return p?sessions[sessionId(TODAY,now.getDay())]||null:null}
function renderWorkout(){let s=currentSession();if(!s){workoutTitle.textContent='No workout today';workoutSub.textContent='Check the Plan tab.';workoutCount.textContent='';workoutBar.style.width='0%';exerciseCard.innerHTML='<div class="muted">Nothing scheduled.</div>';finishBtn.style.display='none';return}finishBtn.style.display='block';workoutTitle.textContent=s.name;workoutSub.textContent=s.status==='complete'?'Completed — your numbers are saved.':s.note;workoutCount.textContent=`${workoutIndex+1}/${s.exercises.length}`;let doneCount=s.exercises.filter(e=>e.setData.every(x=>x.done&&+x.reps>0)).length;workoutBar.style.width=Math.round(doneCount/s.exercises.length*100)+'%';let e=s.exercises[workoutIndex],locked=s.status==='complete';let rows=e.setData.map((r,i)=>`<div class="setrow ${r.done?'done':''}"><div class="setnum">${i+1}</div><input data-w="${i}" type="number" step="2.5" value="${r.weight??''}" ${locked?'disabled':''}><input data-r="${i}" type="number" value="${r.reps??''}" placeholder="reps" ${locked?'disabled':''}><button class="btn ${r.done?'good':'secondary'} checkbtn" data-done="${i}" ${locked?'disabled':''}>${r.done?'✓':'○'}</button></div>`).join('');exerciseCard.innerHTML=`<div class="pager"><button class="btn ghost" id="prevEx">‹</button><div class="pagerTitle"><div class="label">Exercise ${workoutIndex+1}/${s.exercises.length}</div><div class="title">${e.name}</div><div><span class="pill">${e.setsTarget} sets</span><span class="pill">${e.min}–${e.max} reps</span></div></div><button class="btn ghost" id="nextEx">›</button></div><div class="rec">${recommendation(e)}</div><div class="sethead"><div>Set</div><div>Weight</div><div>Reps</div><div></div></div>${rows}<div class="label" style="margin-top:9px">Last set felt</div><div class="effort">${[[3,'Easy'],[2,'Hard'],[1,'Very hard'],[0,'Maxed']].map(x=>`<button class="btn secondary effortBtn ${+e.effort===x[0]?'selected':''}" data-eff="${x[0]}" ${locked?'disabled':''}>${x[1]}</button>`).join('')}</div>${locked?'<div class="doneBadge" style="margin-top:9px">Saved</div>':''}`;prevEx.onclick=()=>{workoutIndex=(workoutIndex-1+s.exercises.length)%s.exercises.length;renderWorkout()};nextEx.onclick=()=>{workoutIndex=(workoutIndex+1)%s.exercises.length;renderWorkout()};if(!locked){exerciseCard.querySelectorAll('[data-w],[data-r]').forEach(inp=>inp.oninput=()=>{let i=+(inp.dataset.w??inp.dataset.r);if(inp.dataset.w!==undefined)e.setData[i].weight=+inp.value||0;else e.setData[i].reps=+inp.value||0;s.updatedAt=Date.now();saveSessions()});exerciseCard.querySelectorAll('[data-done]').forEach(b=>b.onclick=()=>{let i=+b.dataset.done;if(!+e.setData[i].reps)return alert('Enter reps first.');e.setData[i].done=!e.setData[i].done;s.updatedAt=Date.now();saveSessions();renderWorkout();renderToday()});exerciseCard.querySelectorAll('[data-eff]').forEach(b=>b.onclick=()=>{e.effort=+b.dataset.eff;s.updatedAt=Date.now();saveSessions();renderWorkout()})}finishBtn.textContent=s.status==='complete'?'✅ Workout completed':'✅ Finish workout';finishBtn.className='btn '+(s.status==='complete'?'good':'primary');finishBtn.disabled=s.status==='complete'}
finishBtn.onclick=()=>{let s=currentSession();if(!s||s.status==='complete')return;let incomplete=s.exercises.some(e=>e.setData.some(r=>!r.done||!+r.reps));if(incomplete)return alert('Finish every set first so your workout history is complete.');s.status='complete';s.completedAt=Date.now();s.updatedAt=Date.now();saveSessions();renderWorkout();renderToday();renderHistory();alert('Workout completed and saved. Your sets, reps, and weights are staying in history.')}
function renderHistory(){let list=allSessions();historyList.innerHTML=list.length?list.map(s=>`<div class="card historyCard"><div class="histTop"><div><div class="label">${new Date(s.date+'T12:00:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})}</div><div class="title">${s.name}</div></div>${s.status==='complete'?'<span class="doneBadge">✓ Complete</span>':'<span class="pill">In progress</span>'}</div>${(s.exercises||[]).map(e=>{let done=(e.setData||[]).filter(x=>x.done&&+x.reps);if(!done.length)return '';return `<div class="exerciseMini"><b>${e.name}</b> · ${done.map(x=>`${x.weight||'BW'}×${x.reps}`).join(' · ')}</div>`}).join('')}</div>`).join(''):'<div class="card muted">No workouts saved yet.</div>'}
function renderPlan(){let order=[1,2,4,5,6],names={1:'Monday',2:'Tuesday',4:'Thursday',5:'Friday',6:'Saturday'};planList.innerHTML=order.map(d=>{let p=plans[d];return `<div class="card planDay"><div class="label">${names[d]}</div><div class="title">${p.name}</div><div class="muted small" style="margin:3px 0 7px">${p.note}</div>${p.ex.map(e=>`<div class="planEx"><span>${e[0]}</span><b>${e[1]} × ${e[2]}–${e[3]}</b></div>`).join('')}</div>`}).join('')}
function showTab(id){document.querySelectorAll('.section').forEach(s=>s.classList.toggle('active',s.id===id));document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.tab===id));if(id==='workout')renderWorkout();if(id==='history')renderHistory();if(id==='plan')renderPlan()}
document.querySelectorAll('.navbtn').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));migrateLegacy();renderToday();renderHistory();renderPlan();
</script>
</body>
</html>
